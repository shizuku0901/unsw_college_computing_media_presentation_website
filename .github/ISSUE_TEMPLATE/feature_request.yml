name: "✨ Feature request"
description: "Suggest a new feature or improvement"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "Problem to solve"
      description: "What is the problem or limitation?"
      placeholder: "When I log a workout, I can't see my past records"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed solution"
      description: "How would you like it to work?"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
      description: "Other approaches you thought about, if any"

  - type: textarea
    id: additional
    attributes:
      label: "Additional context"
      description: "Anything else, such as mockups or screenshots"