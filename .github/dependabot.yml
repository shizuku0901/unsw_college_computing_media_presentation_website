version: 2
updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"

  # Keep Python dependencies (fitness_app/requirements.txt) up to date
  - package-ecosystem: "pip"
    directory: "/fitness_app"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"