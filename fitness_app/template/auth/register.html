{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}

<h1 class="text-3xl font-bold text-white mb-8">Register</h1>

<div class="bg-gray-900 border border-gray-800 rounded-xl p-6">
    <div id="error-message" class="text-red-400 text-sm mb-4 hidden"></div>

    <div class="flex flex-col gap-4">
        <div>
            <label class="text-gray-400 text-sm block mb-2">Name</label>
            <input type="text" id="name" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-2 text-gray-200 focus:outline-none focus:border-green-400">
        </div>

        <div>
            <label class="text-gray-400 text-sm block mb-2">Age</label>
            <input type="number" id="age" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-2 text-gray-200 focus:outline-none focus:border-green-400">
        </div>

        <div>
            <label class="text-gray-400 text-sm block mb-2">Email</label>
            <input type="email" id="email" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-2 text-gray-200 focus:outline-none focus:border-green-400">
        </div>

        <div>
            <label class="text-gray-400 text-sm block mb-2">Password</label>
            <input type="password" id="password" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-2 text-gray-200 focus:outline-none focus:border-green-400">
        </div>

        <button onclick="register()" class="bg-green-400 text-gray-950 font-bold py-3 rounded-lg hover:bg-white transition-colors">
            Register
        </button>

        <p class="text-gray-400 text-sm text-center">
            Already have an account? 
            <a href="{{ url_for('auth.login') }}" class="text-green-400 hover:text-white">Login</a>
        </p>
    </div>
</div>

<form id="register-form" method="POST" action="{{ url_for('auth.register') }}" class="hidden">
    <input type="hidden" name="uid" id="uid">
    <input type="hidden" name="name" id="name-hidden">
    <input type="hidden" name="age" id="age-hidden">
    <input type="hidden" name="email" id="email-hidden">
</form>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBfowNgdqfzeLtq1EzCsigHrlSZiVqCRJg",
        authDomain: "unsw-college-website.firebaseapp.com",
        projectId: "unsw-college-website"
    };

    firebase.initializeApp(firebaseConfig);

    async function register() {
        const name = document.getElementById('name').value;
        const age = document.getElementById('age').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('error-message');

        try {
            const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
            document.getElementById('uid').value = userCredential.user.uid;
            document.getElementById('name-hidden').value = name;
            document.getElementById('age-hidden').value = age;
            document.getElementById('email-hidden').value = email;
            document.getElementById('register-form').submit();
        } catch (error) {
            errorDiv.textContent = error.message;
            errorDiv.classList.remove('hidden');
        }
    }
</script>

{% endblock %}
