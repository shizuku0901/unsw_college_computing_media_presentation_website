{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto p-6">
  <h1 class="text-2xl font-bold text-green-400 mb-4">Weekly Goal</h1>

  <form method="POST" class="mb-8">
    <label for="weekly_minutes" class="block text-gray-200 mb-2">
      Target minutes per week
    </label>
    <input id="weekly_minutes" name="weekly_minutes" type="number" min="1" max="3000" required
           value="{{ target or '' }}"
           class="w-full p-2 rounded bg-gray-800 text-white border border-gray-600">
    <button class="mt-3 px-4 py-2 rounded bg-green-500 text-gray-950 font-semibold">
      Save goal
    </button>
  </form>

  {% if target %}
  <p class="text-gray-200 mb-2">{{ done }} / {{ target }} min this week ({{ percent }}%)</p>
  <div class="w-full h-4 bg-gray-800 rounded" role="progressbar"
       aria-valuenow="{{ percent }}" aria-valuemin="0" aria-valuemax="100">
    <div class="h-4 bg-green-400 rounded" style="width: {{ percent }}%"></div>
  </div>
  {% if percent >= 100 %}<p class="mt-3 text-green-400">Goal achieved! 🎉</p>{% endif %}
  {% else %}
  <p class="text-gray-400">No goal set yet.</p>
  {% endif %}
</div>
{% endblock %}
