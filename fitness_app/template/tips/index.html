{% extends 'base.html' %}

{% block title %}Tips{% endblock %}

{% block content %}

<h1 class="text-3xl font-bold text-white mb-8">Exercise Tips</h1>

{% for tip in tips %}
<div class="bg-gray-900 border border-gray-800 rounded-xl p-6 mb-4">
    <p class="text-gray-500 text-sm mb-2">{{ tip.published_date }}</p>
    <h2 class="text-green-400 font-semibold text-lg mb-3">{{ tip.title }}</h2>
    <p class="mb-3">{{ tip.detail }}</p>
    <p class="text-gray-500 text-sm">Source: {{ tip.source }}</p>
</div>
{% endfor %}

{% endblock %}
