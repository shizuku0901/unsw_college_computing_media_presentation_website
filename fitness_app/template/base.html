<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fitness App{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen">

    <nav class="bg-gray-900 border-b border-gray-800 px-8 py-4 flex gap-6">
        <a href="{{ url_for('welcome.index') }}" class="text-green-400 font-semibold hover:text-white text-sm">Home</a>
        <a href="{{ url_for('tips.index') }}" class="text-green-400 font-semibold hover:text-white text-sm">Tips</a>
        <a href="{{ url_for('facility.index') }}" class="text-green-400 font-semibold hover:text-white text-sm">Facility</a>
        <a href="{{ url_for('record.index') }}" class="text-green-400 font-semibold hover:text-white text-sm">Record</a>
    </nav>

    <main class="max-w-2xl mx-auto mt-12 px-6">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
